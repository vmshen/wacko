<div class="page">

  <div class="cover">
    <!-- replace cover.jpg with your own image filename once you upload one -->
    <img src="cover.jpg" alt="">
  </div>

  <div class="hero-quote" id="hero-quote"></div>

  <main id="thoughts"></main>

  <footer>updated whenever the mood strikes, not on a schedule</footer>

</div>

<script>
  const quotes = [
    "The world is a book, and those who do not travel read only one page.",
    "Tell me, what is it you plan to do with your one wild and precious life?",
    "We travel, some of us forever, to seek other states, other lives, other souls.",
    "A person who speaks four languages is quadrilingual. A person who speaks one language is American."
  ];
  document.getElementById("hero-quote").textContent =
    quotes[Math.floor(Math.random() * quotes.length)];

  const thoughts = [
    { title: "on being everywhere at once", text: "Some days my head is six countries and four languages at the same time and I genuinely don't know which one I'm thinking in." },
    { title: "a stranger's story", text: "Met a man on a night train who'd crossed three borders on foot as a kid. Told it like it was nothing. I haven't stopped thinking about it." },
    { title: "small note", text: "Started a new basil plant. Third attempt. Praying this one survives me." }
  ];

  const container = document.getElementById("thoughts");
  thoughts.forEach(t => {
    const block = document.createElement("div");
    block.className = "thought";
    const h = document.createElement("h3"); h.textContent = t.title;
    const p = document.createElement("p"); p.textContent = t.text;
    block.appendChild(h); block.appendChild(p);
    container.appendChild(block);
  });
</script>

</body>
</html>
